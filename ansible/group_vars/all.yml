---
# Variables globales du lab OpenStack

# Versions
openstack_release: "2024.1"             # Caracal (LTS jusqu'à 2026-04)
kolla_ansible_version: "19.0.0"
ceph_release: "reef"                    # 18.x, stable

# VIP de management (sera portée par keepalived sur le controller).
# IP libre dans 192.168.10.0/24, hors plage des nœuds.
kolla_internal_vip_address: "192.168.10.50"
kolla_external_vip_address: "192.168.30.50"

# Interfaces réseau (cohérent avec hosts.yml)
network_interface: "{{ network_mgmt_iface }}"      # ens33 — API + tenant VXLAN endpoint
neutron_external_interface: "{{ network_ext_iface }}"  # ens35 — pour ports br-ex
storage_interface: "{{ network_storage_iface }}"   # ens36 — Ceph

# Mots de passe (générés par kolla-genpwd, mais on fixe ceux du lab pour reproductibilité)
# ⚠️ EN PROD : ne jamais commiter ce fichier en clair, utiliser ansible-vault.
kolla_admin_password: "openstack-lab-admin"
keystone_admin_password: "{{ kolla_admin_password }}"

# Backends Ceph activés dans Kolla
glance_backend_ceph: "yes"
cinder_backend_ceph: "yes"
nova_backend_ceph: "yes"
gnocchi_backend_storage: "ceph"

# Désactiver les services optionnels pour économiser RAM/CPU
enable_cinder: "yes"
enable_neutron_provider_networks: "yes"
enable_horizon: "yes"
enable_heat: "no"
enable_octavia: "no"
enable_magnum: "no"
enable_designate: "no"
enable_barbican: "no"

# Pools Ceph (créés par le rôle ceph)
ceph_pools:
  - { name: images,  pg_num: 32, application: rbd }
  - { name: volumes, pg_num: 32, application: rbd }
  - { name: vms,     pg_num: 32, application: rbd }
  - { name: backups, pg_num: 16, application: rbd }
