---
# Inventaire du lab OpenStack — 5 VMs
# Toutes les VMs sont jointes via leur IP de management (VMnet10).

all:
  vars:
    ansible_user: dio
    ansible_python_interpreter: /usr/bin/python3
    # Réseau de management (VMnet10) — utilisé pour les API OpenStack et SSH
    network_mgmt_cidr: 192.168.10.0/24
    network_mgmt_iface: ens33
    # Réseau tenant (VMnet20) — VXLAN entre instances
    network_tenant_cidr: 192.168.20.0/24
    network_tenant_iface: ens34
    # Réseau external (VMnet30) — floating IPs / sortie internet pour instances
    network_ext_iface: ens35
    # Réseau storage (VMnet40) — Ceph public + cluster
    network_storage_cidr: 192.168.40.0/24
    network_storage_iface: ens36

  children:
    deployer:
      hosts:
        deployer:
          ansible_host: 192.168.10.5

    controllers:
      hosts:
        controller:
          ansible_host: 192.168.10.10
          ip_mgmt: 192.168.10.10
          ip_tenant: 192.168.20.10
          ip_storage: 192.168.40.10

    computes:
      hosts:
        compute01:
          ansible_host: 192.168.10.21
          ip_mgmt: 192.168.10.21
          ip_tenant: 192.168.20.21
          ip_storage: 192.168.40.21
          ceph_osd_device: /dev/sdb
        compute02:
          ansible_host: 192.168.10.22
          ip_mgmt: 192.168.10.22
          ip_tenant: 192.168.20.22
          ip_storage: 192.168.40.22
          ceph_osd_device: /dev/sdb
        compute03:
          ansible_host: 192.168.10.23
          ip_mgmt: 192.168.10.23
          ip_tenant: 192.168.20.23
          ip_storage: 192.168.40.23
          ceph_osd_device: /dev/sdb

    # Groupes logiques pour les rôles
    ceph_mons:
      hosts:
        controller:
        compute01:
        compute02:
    ceph_osds:
      hosts:
        compute01:
        compute02:
        compute03:

    openstack:
      children:
        controllers:
        computes:
